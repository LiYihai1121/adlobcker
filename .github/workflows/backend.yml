name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -v

  frontend:
    name: Build frontend (TS + Tailwind)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Verify build artifacts
        run: |
          test -f ../app/static/app.js
          test -f ../app/static/style.css

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: backend
          push: false
          tags: adblocker-backend:ci
          load: true
      - name: Smoke test /health
        run: |
          docker run -d --name adblocker-ci -p 8000:8000 adblocker-backend:ci
          sleep 8
          curl --retry 5 --retry-delay 2 --retry-connrefused -fsS http://localhost:8000/health
          docker rm -f adblocker-ci

